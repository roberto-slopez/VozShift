# Build README.md → static HTML and deploy to GitHub Pages.
# Repo settings: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - LICENSE
      - CODE_OF_CONDUCT.md
      - '.github/workflows/pages.yml'
      - '.github/scripts/build_pages.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown
        run: pip install "markdown>=3.5"

      - name: Build site from README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/build_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
