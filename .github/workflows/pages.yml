# Build README.md → static HTML and deploy to GitHub Pages.
# Repo settings: Settings → Pages → Build and deployment → Source: GitHub Actions.

# Node 20 is deprecated on runners; pin actions that use Node 24 and opt in explicitly.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - README.md
      - LICENSE
      - CODE_OF_CONDUCT.md
      - '.github/workflows/pages.yml'
      - '.github/scripts/build_pages.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown
        run: pip install "markdown>=3.5"

      - name: Build site from README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/build_pages.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
